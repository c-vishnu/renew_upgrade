name: Deploy to VM

on:
  push:
    branches: [main]

env:
  APP_DIR: /home/devuser/projects/renew_upgrade

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/devuser/projects/renew_upgrade

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: /home/devuser/projects/renew_upgrade/package-lock.json

      - name: Pull latest code
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: npm run install:all

      - name: Build frontend
        run: npm run build:prod

      - name: Restart app
        run: sudo -n /bin/systemctl restart renew-upgrade

      - name: Health check
        run: |
          sleep 3
          curl -f http://localhost:4004/api/health

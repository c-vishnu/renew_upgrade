name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm run install:all

      - name: Build frontend
        run: npm run build:prod

      - name: Restart app
        run: sudo systemctl restart renew-upgrade

      - name: Health check
        run: curl -f http://localhost:4000/api/health
